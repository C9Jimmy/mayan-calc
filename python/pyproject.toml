[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mayan-calc"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["# pragma: no cover"]
